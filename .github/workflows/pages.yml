name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  # Drip publishing: a daily build at 07:15 NZDT (18:15 UTC; 06:15 in NZST) publishes every guide whose
  # publishAt has come (lib/publish.ts). Scheduled runs always build the latest commit on main.
  schedule:
    - cron: "15 18 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: guide and translation dates (scripts/build-article-dates.mjs) come from git.
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # One publish day for the whole job, so the build, export and tests agree even across midnight.
      - run: echo "BUILD_DATE=$(TZ=Pacific/Auckland date +%F)" >> "$GITHUB_ENV"
      # Fast gate for the deploy: content audit, build and static export. The full test suite runs
      # separately in checks.yml after every push and reports failures without holding the deploy.
      - run: npm run deploy:gate
        env:
          NODE_OPTIONS: --max-old-space-size=6144
          # Decrypts the place pages' data (scripts/decrypt-places.mjs); this repository is public.
          PLACES_KEY: ${{ secrets.PLACES_KEY }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: pages-dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.deployment_retry.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      # GitHub caps the deploy wait at 10 minutes. The file sync sometimes stalls past that (often while
      # another site on the account deploys), and a second attempt usually finishes in about a minute.
      - id: deployment
        uses: actions/deploy-pages@v4
        continue-on-error: true
        with:
          timeout: 600000
      - id: deployment_retry
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v4
        with:
          timeout: 600000
